name: build

# 打 tag vX.Y.Z 时构建四份产物并挂到 GitHub Release；也可以在网页上手动触发。
#
# ★ 这里**只构建，不部署**。生产部署由本机跑 build_tools/deploy_downloads.sh。
#   原因见下面 release job 的注释（runner 到我们那台服务器的上行太慢）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# runner 默认编码因平台而异，统一成 UTF-8：日志里的中文和 manifest 的备注
# 才不会在 Windows 上炸 UnicodeEncodeError。
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    name: build-${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            key: windows-x64
            spec: agent.spec
            artifact: ClaudeCodeAssistant-win-x64.exe
          - runner: macos-15            # Apple Silicon
            key: macos-arm64
            spec: agent.spec
            artifact: ClaudeCodeAssistant-macos-arm64.zip
          - runner: macos-15-intel      # Intel
            key: macos-x64
            spec: agent.spec
            artifact: ClaudeCodeAssistant-macos-x64.zip
          - runner: ubuntu-22.04        # 老一点保证 glibc 兼容
            key: linux-x64
            # ★ Linux 发的是**服务器版**（没有图形界面）：server.spec 用
            #   server_main.py 当入口，并把 tkinter / customtkinter / openai 整包排除。
            #   `python main.py` 在没有 $DISPLAY 的机器上根本起不来。
            spec: server.spec
            artifact: ClaudeCodeAssistant-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python -c "import config; print(config.APP_VERSION)")
          echo "tag=$TAG config=$APP"
          if [ "$TAG" != "$APP" ]; then
            echo "::error::tag $TAG 与 config.APP_VERSION $APP 不一致"
            exit 1
          fi

      - name: Generate Windows version info
        if: runner.os == 'Windows'
        run: python build_tools/make_version_info.py

      - name: Build
        run: python -m PyInstaller ${{ matrix.spec }} --noconfirm --clean

      # 服务器版没有界面，CI 里就能验：--version 必须能跑通（顺带证明
      # 没有把 tkinter 拖进来，也没有缺 lzma 之类的隐式依赖）。
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ./dist/ClaudeCodeAssistant --version
          ./dist/ClaudeCodeAssistant --help > /dev/null

      # ---------------- Windows ----------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "dist/ClaudeCode安装助手.exe" "ClaudeCodeAssistant-win-x64.exe"
          ls -l ClaudeCodeAssistant-win-x64.exe

      # ---------------- macOS ----------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls -R dist | head -50
          ditto -c -k --keepParent "dist/ClaudeCodeAssistant.app" "${{ matrix.artifact }}"
          ls -l "${{ matrix.artifact }}"

      # ---------------- Linux ----------------
      # 服务器版：一个可执行文件就够了。**不要**再塞 .desktop —— 那是给
      # "双击在图形桌面里打开" 用的，这个包是终端程序，装进去只会误导。
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          DIR=ClaudeCodeAssistant-linux-x64
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cp dist/ClaudeCodeAssistant "$DIR/"
          cp agent.png "$DIR/"
          chmod +x "$DIR/ClaudeCodeAssistant"
          tar -czf "${{ matrix.artifact }}" "$DIR"
          ls -l "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # release：只在打 tag 时跑，把四个产物挂到 GitHub Release 上。
  #
  # ★ CI **不往 aikaui.com 部署**。GitHub runner 到 49.233.72.225 的上行只有
  #   ~17KB/s（2026-10-28 实测：136MB 传了十几分钟才走 11MB，按那速度要两小时），
  #   而本机到同一台机器约 5MB/s。所以分工是：
  #
  #     CI    只构建（macOS 的包只能在 macOS runner 上打）+ 挂 Release
  #     本机  部署：从 Release 下四个包，跑 build_tools/deploy_downloads.sh
  #
  #   顺带一个好处：发版不再"打了个 tag 就自动改生产"，部署是一台机器上的显式动作。
  #   （以前那版 publish job 在这里 ssh 上去 scp 136MB，卡死过两次 —— 1.4.6 和 1.4.7
  #   都是取消它、改本机发的。）
  # ------------------------------------------------------------------
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    # ★ job 级的 `permissions:` 就是这个 job 拿到的 GITHUB_TOKEN 权限本身，
    #   不是"在仓库默认值之上加减"。仓库默认是 read（本仓库实测：
    #   GET /repos/…/actions/permissions/workflow → default_workflow_permissions=read），
    #   只要写了这一段，`gh release create` 就有写权限。
    #   万一它仍然 403（比如被组织策略卡住），去 Settings → Actions → General →
    #   Workflow permissions 改成 "Read and write permissions"，不用改这里。
    permissions:
      contents: write                # 建 Release、上传资产要写权限
    steps:
      # fetch-depth: 0 —— 注释 tag 的对象要拿得到，下面读发版说明才读得出正文。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show artifacts
        run: ls -lR release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 发版说明直接取注释 tag 的正文 —— 和本机部署时传给 latest.json 的
          # notes 同源（都来自那个 tag），一处维护。
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 重跑构建时不要因为"已经存在"就红掉
            echo "Release $GITHUB_REF_NAME 已存在，直接覆盖资产"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) 字节"'

      # 把"下一步在本机干什么"直接写进 Actions 的摘要页：
      # 不然下次看到绿色的 tag 构建，很容易以为线上已经更新了。
      - name: 下一步（本机部署）
        run: |
          {
            echo "## ${GITHUB_REF_NAME} 构建完成，**线上还没变**"
            echo
            echo "四个产物已挂到 Release：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            echo
            echo "部署在本机跑（runner 上行只有 ~17KB/s，传不动）："
            echo
            echo '```bash'
            echo "gh release download ${GITHUB_REF_NAME} --dir release"
            echo "DEPLOY_HOST=… DEPLOY_USER=root DEPLOY_SSH_KEY=… \\"
            echo "  NOTES=\"\$(git tag -l --format='%(contents:subject)' ${GITHUB_REF_NAME})\" \\"
            echo "  bash build_tools/deploy_downloads.sh ${GITHUB_REF_NAME#v} ./release"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

